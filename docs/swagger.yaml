basePath: /api
definitions:
  app.ProgressEvent:
    properties:
      elapsed_ms:
        description: 耗时（毫秒）
        type: integer
      error:
        description: 错误信息
        type: string
      inserted:
        description: 新增条目数
        type: integer
      inserted_ids:
        description: 新增条目ID（供前端高亮）
        items:
          type: integer
        type: array
      skipped:
        description: 去重跳过数
        type: integer
      source_id:
        description: 渠道ID（source_* 事件）
        type: integer
      source_name:
        description: 渠道显示名
        type: string
      type:
        description: 事件类型（见 Event* 常量）
        type: string
    type: object
  app.RefreshResult:
    properties:
      errors:
        description: 错误信息
        items:
          type: string
        type: array
      inserted:
        description: 新入库条目数
        type: integer
      inserted_ids:
        description: 本轮新增条目的 ID（供前端高亮新内容）
        items:
          type: integer
        type: array
      skipped:
        description: 去重跳过的条目数
        type: integer
      sources:
        description: 处理的渠道数
        type: integer
    type: object
  server.EntryDTO:
    properties:
      archive:
        description: 是否已归档
        type: boolean
      author:
        description: 作者
        type: string
      content:
        description: 正文
        type: string
      content_type:
        description: 内容类型
        type: string
      extra:
        additionalProperties:
          type: string
        description: 渠道特有字段
        type: object
      favorite:
        description: 是否已收藏
        type: boolean
      fetched_at:
        description: 抓取时间（RFC3339）
        type: string
      guid:
        description: 渠道自带稳定ID
        type: string
      id:
        description: 条目ID
        type: integer
      published_at:
        description: 发布时间（RFC3339）
        type: string
      read:
        description: 是否已读
        type: boolean
      read_later:
        description: 是否已加入「稍后再阅」
        type: boolean
      source_id:
        description: 归属渠道实例ID
        type: integer
      summary:
        description: 摘要
        type: string
      tags:
        description: 标签
        items:
          type: string
        type: array
      title:
        description: 标题
        type: string
      url:
        description: 规范化后的链接
        type: string
    type: object
  server.EntryListResponse:
    properties:
      items:
        description: 条目列表
        items:
          $ref: '#/definitions/server.EntryDTO'
        type: array
      page:
        description: 页码
        type: integer
      page_size:
        description: 每页数量
        type: integer
      total:
        description: 总数
        type: integer
    type: object
  server.ErrorResponse:
    properties:
      error:
        description: 错误信息
        type: string
    type: object
  server.FetchLogDTO:
    properties:
      elapsed_ms:
        description: 耗时（毫秒）
        type: integer
      error:
        description: 错误信息（成功为空）
        type: string
      id:
        description: 日志ID
        type: integer
      inserted:
        description: 新增条目数
        type: integer
      skipped:
        description: 去重跳过数
        type: integer
      source_id:
        description: 归属渠道实例ID
        type: integer
      started_at:
        description: 采集开始时间（RFC3339）
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  server.FetchLogListResponse:
    properties:
      items:
        description: 日志列表（按时间倒序）
        items:
          $ref: '#/definitions/server.FetchLogDTO'
        type: array
      total:
        description: 返回条数
        type: integer
    type: object
  server.OsInfo:
    properties:
      arch:
        description: 系统架构
        type: string
      cpu_count:
        description: CPU 核心数
        type: integer
      cpu_model:
        description: CPU 型号
        type: string
      hostname:
        description: 主机名
        type: string
      os_name:
        description: 操作系统名称
        type: string
      platform:
        description: 系统平台
        type: string
      start_time:
        description: 系统启动时间（RFC3339）
        type: string
      total_mem_mb:
        description: 总内存（MB）
        type: integer
    type: object
  server.OsState:
    properties:
      cpu_freq:
        description: CPU 频率
        type: string
      cpu_percent:
        description: CPU 使用率（%）
        type: integer
      free_mem_mb:
        description: 空闲内存（MB）
        type: integer
      uptime:
        description: 运行时长
        type: string
    type: object
  server.SourceDTO:
    properties:
      config:
        description: 渠道配置 JSON 对象
        items:
          type: integer
        type: array
      created_at:
        description: 创建时间
        type: string
      enabled:
        description: 是否启用
        type: boolean
      fail_count:
        description: 连续失败次数
        type: integer
      fetch_count:
        description: 累计采集次数
        type: integer
      id:
        description: 渠道实例ID
        type: integer
      interval:
        description: 刷新间隔（秒）
        type: integer
      last_elapsed_ms:
        description: 最近一次耗时（毫秒）
        type: integer
      last_entry_at:
        description: 最新条目的发布时间
        type: string
      last_error:
        description: 最近一次错误
        type: string
      last_fetch_at:
        description: 最近一次采集时间（RFC3339）
        type: string
      last_success_at:
        description: 最后成功时间（RFC3339）
        type: string
      name:
        description: 显示名
        type: string
      success_count:
        description: 累计成功次数
        type: integer
      success_rate:
        description: 成功率（0~1）
        type: number
      type:
        description: 渠道类型标识
        type: string
      updated_at:
        description: 更新时间
        type: string
    type: object
  server.SourceListResponse:
    properties:
      items:
        description: 渠道列表
        items:
          $ref: '#/definitions/server.SourceDTO'
        type: array
      total:
        description: 总数
        type: integer
    type: object
  server.SourceProbeRequest:
    properties:
      config:
        description: 渠道配置 JSON 对象
        items:
          type: integer
        type: array
      type:
        description: 渠道类型标识
        type: string
    type: object
  server.SourceRequest:
    properties:
      config:
        description: 渠道配置 JSON 对象
        items:
          type: integer
        type: array
      enabled:
        description: 是否启用
        type: boolean
      interval:
        description: 刷新间隔（秒）
        type: integer
      name:
        description: 显示名
        type: string
      type:
        description: 渠道类型标识
        type: string
    type: object
  server.SysInfo:
    properties:
      build_time:
        description: 构建时间
        type: string
      build_version:
        description: 构建版本
        type: string
      go_version:
        description: Go 版本
        type: string
      start_time:
        description: 服务启动时间（RFC3339）
        type: string
    type: object
  server.SysState:
    properties:
      gc_total_count:
        description: 垃圾回收总次数
        type: integer
      heap_used_mb:
        description: 堆内存使用量（MB）
        type: integer
      num_goroutine:
        description: 当前协程数
        type: integer
      uptime:
        description: 运行时长
        type: string
    type: object
  source.ProbeInfo:
    properties:
      title:
        description: 渠道标题（如 feed 的 <title>），可能为空
        type: string
    type: object
info:
  contact: {}
  description: 拾取、清洗、归档你关心的内容。把 RSS、网页、聊天机器人里的信息统一成同一个阅读流。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: NewsGlean API
  version: 0.1.0
paths:
  /entry/{id}:
    get:
      parameters:
      - description: 条目ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.EntryDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 获取单个条目
      tags:
      - entry
  /entry/{id}/archive:
    put:
      consumes:
      - application/json
      parameters:
      - description: 条目ID
        in: path
        name: id
        required: true
        type: integer
      - description: '{\'
        in: body
        name: req
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.EntryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 设置/取消归档
      tags:
      - entry
  /entry/{id}/favorite:
    put:
      consumes:
      - application/json
      parameters:
      - description: 条目ID
        in: path
        name: id
        required: true
        type: integer
      - description: '{\'
        in: body
        name: req
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.EntryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 设置/取消收藏
      tags:
      - entry
  /entry/{id}/read:
    put:
      consumes:
      - application/json
      parameters:
      - description: 条目ID
        in: path
        name: id
        required: true
        type: integer
      - description: '{\'
        in: body
        name: req
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.EntryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 设置/取消已读
      tags:
      - entry
  /entry/{id}/read-later:
    put:
      consumes:
      - application/json
      description: 标记或取消标记条目的「稍后再阅」状态
      parameters:
      - description: 条目ID
        in: path
        name: id
        required: true
        type: integer
      - description: '{\'
        in: body
        name: req
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.EntryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 设置/取消稍后再阅
      tags:
      - entry
  /entry/list:
    get:
      description: 分页列出条目，可按渠道、已读/收藏/归档状态过滤
      parameters:
      - description: 页码（从1开始）
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 按渠道过滤
        in: query
        name: source_id
        type: integer
      - description: 按已读状态过滤
        in: query
        name: read
        type: boolean
      - description: 按收藏状态过滤
        in: query
        name: favorite
        type: boolean
      - description: 按归档状态过滤
        in: query
        name: archive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.EntryListResponse'
      summary: 列出条目
      tags:
      - entry
  /entry/read-later:
    get:
      description: 分页列出标记为「稍后再阅」的条目，按加入时间倒序
      parameters:
      - description: 页码（从1开始）
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.EntryListResponse'
      summary: 列出稍后再阅条目
      tags:
      - entry
  /os/info:
    get:
      description: 获取主机名、操作系统、CPU 与内存等基础信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.OsInfo'
      summary: 获取操作系统信息
      tags:
      - 系统信息
  /os/state:
    get:
      description: 获取系统的运行时长、空闲内存与 CPU 使用率
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.OsState'
      summary: 获取操作系统状态
      tags:
      - 系统信息
  /refresh:
    post:
      description: 遍历所有启用的渠道拉取新内容并写库（三层去重）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.RefreshResult'
      summary: 手动触发一轮采集
      tags:
      - refresh
  /refresh/stream:
    get:
      description: 以 Server-Sent Events 实时推送采集进度（渠道开始/完成/失败），供前端显示进度与新内容高亮
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.ProgressEvent'
      summary: 订阅采集进度（SSE）
      tags:
      - refresh
  /search:
    get:
      description: 检索条目标题/摘要/正文/作者；中文按 bigram 分词，多词按 AND 匹配
      parameters:
      - description: 关键词
        in: query
        name: q
        required: true
        type: string
      - description: 页码（从1开始）
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 按渠道过滤
        in: query
        name: source_id
        type: integer
      - description: 按已读状态过滤
        in: query
        name: read
        type: boolean
      - description: 按收藏状态过滤
        in: query
        name: favorite
        type: boolean
      - description: 按归档状态过滤
        in: query
        name: archive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.EntryListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 全文检索
      tags:
      - entry
  /source:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SourceListResponse'
      summary: 列出渠道实例
      tags:
      - source
    post:
      consumes:
      - application/json
      description: 校验配置后入库（走适配器 Validate，失败不入库）
      parameters:
      - description: 渠道参数
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/server.SourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SourceDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 新增渠道实例
      tags:
      - source
  /source/{id}:
    delete:
      parameters:
      - description: 渠道实例ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 删除渠道实例（软删除）
      tags:
      - source
    get:
      parameters:
      - description: 渠道实例ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SourceDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 获取单个渠道实例
      tags:
      - source
    put:
      consumes:
      - application/json
      parameters:
      - description: 渠道实例ID
        in: path
        name: id
        required: true
        type: integer
      - description: 渠道参数
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/server.SourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SourceDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 更新渠道实例
      tags:
      - source
  /source/{id}/logs:
    get:
      description: 按时间倒序返回指定渠道最近的采集日志，用于排障
      parameters:
      - description: 渠道实例ID
        in: path
        name: id
        required: true
        type: integer
      - description: 返回条数上限（默认 50，最大 200）
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.FetchLogListResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 列出渠道采集日志
      tags:
      - source
  /source/probe:
    post:
      consumes:
      - application/json
      description: 在保存前探测渠道元信息（如 feed 标题），供「自动获取显示名」使用
      parameters:
      - description: 渠道类型与配置
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/server.SourceProbeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/source.ProbeInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: 探测渠道元信息
      tags:
      - source
  /sys/info:
    get:
      description: 获取服务的启动时间、构建时间与版本信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SysInfo'
      summary: 获取系统信息
      tags:
      - 系统信息
  /sys/state:
    get:
      description: 获取服务的运行时长、协程数、堆内存与 GC 次数
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SysState'
      summary: 获取系统状态
      tags:
      - 系统状态
swagger: "2.0"
