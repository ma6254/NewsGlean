# NewsGlean 反向代理配置（Nginx）
#
# 目标架构：
#   公网 → 443 (HTTPS + Basic Auth) → 127.0.0.1:28080 (Go 服务，保持回环)
#
# 用法（详见 deploy/DEPLOY.md）：
#   1. 生成口令文件：htpasswd -B -c /etc/nginx/.htpasswd you
#   2. 证书用 certbot 或已有证书，替换下方 ssl_certificate* 路径
#   3. 把 newsglean.example.com 换成你的域名
#   4. 文件放入 /etc/nginx/conf.d/ 或 sites-available 后 `nginx -t && systemctl reload nginx`

# ---- HTTP：仅用于证书校验 + 强制跳转 HTTPS ----
server {
	listen 80;
	listen [::]:80;
	server_name newsglean.example.com;

	# certbot webroot 校验用，未用 certbot 可删掉这个 location
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

# ---- HTTPS：TLS 终止 + Basic Auth + 反代 ----
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name newsglean.example.com;

	ssl_certificate     /etc/letsencrypt/live/newsglean.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/newsglean.example.com/privkey.pem;

	# —— 单账户访问门：HTTP Basic Auth ——
	# 一次锁死 /api、/swagger、静态页面与 SSE，前端零改动。
	auth_basic "NewsGlean";
	auth_basic_user_file /etc/nginx/.htpasswd;

	location / {
		proxy_pass http://127.0.0.1:28080;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection        "";

		# —— SSE（/api/refresh/stream）关键配置 ——
		# 不关缓冲/不拉长超时，采集进度流会被 Nginx 掐断
		proxy_buffering     off;
		proxy_cache         off;
		proxy_read_timeout  1h;
		proxy_send_timeout  1h;
		add_header X-Accel-Buffering no;
	}
}
