<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsGlean 实时日志</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: ui-monospace, Consolas, "Courier New", monospace; background:#0f1117; color:#d6d8e0; }
  header { position:sticky; top:0; display:flex; gap:8px; align-items:center; padding:8px 12px; background:#161a24; border-bottom:1px solid #232838; flex-wrap:wrap; }
  h1 { font-size:14px; margin:0 12px 0 0; color:#8b93a7; font-weight:600; }
  button { background:#1d2333; color:#aab3c5; border:1px solid #2a3247; border-radius:4px; padding:4px 12px; cursor:pointer; font-size:12px; }
  button:hover { background:#242c40; }
  button.active { background:#2f6feb; color:#fff; border-color:#2f6feb; }
  #status { margin-left:auto; font-size:12px; color:#8b93a7; }
  #status.on { color:#3fb950; }
  #out { margin:0; padding:8px 12px; }
  .row { line-height:1.55; display:flex; flex-wrap:wrap; gap:0 6px; }
  .row.hidden { display:none; }
  .t { color:#5c6476; }
  .DEBUG { color:#8b93a7; }
  .INFO  { color:#3fb950; }
  .WARN  { color:#d29922; }
  .ERROR { color:#f85149; font-weight:700; }
  .tag { color:#39c5cf; }
  .caller { color:#5c6476; }
  .chan-error { background:rgba(248,81,73,.06); }
  .fields { color:#5c6476; }
</style>
</head>
<body>
<header>
  <h1>NewsGlean 实时日志</h1>
  <button data-ch="all" class="active">全部</button>
  <button data-ch="access">access</button>
  <button data-ch="error">error</button>
  <button id="clear">清空</button>
  <span id="status">连接中…</span>
</header>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const status = document.getElementById('status');
let filter = 'all';
let ws = null;
let pending = [];

function connect() {
  status.textContent = '连接中…';
  status.className = '';
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws');
  ws.onopen = () => { status.textContent = '实时'; status.className = 'on'; for (const m of pending) append(m); pending = []; };
  ws.onmessage = ev => {
    let rec;
    try { rec = JSON.parse(ev.data); } catch (e) { return; }
    if (ws.readyState === 1) append(rec); else pending.push(rec);
  };
  ws.onclose = () => { status.textContent = '已断开，2 秒后重连'; status.className = ''; setTimeout(connect, 2000); };
}

function append(rec) {
  const row = document.createElement('div');
  row.className = 'row chan-' + rec.channel + (filter !== 'all' && rec.channel !== filter ? ' hidden' : '');
  const time = document.createElement('span'); time.className = 't'; time.textContent = rec.time + ' ';
  const lv = document.createElement('span'); lv.className = rec.level; lv.textContent = rec.level + ' ';
  row.appendChild(time); row.appendChild(lv);
  if (rec.tags && rec.tags.length) {
    const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = rec.tags.map(t => '[' + t + ']').join('') + ' ';
    row.appendChild(tg);
  }
  if (rec.caller) {
    const cl = document.createElement('span'); cl.className = 'caller'; cl.textContent = rec.caller + ' ';
    row.appendChild(cl);
  }
  const msg = document.createElement('span'); msg.textContent = rec.msg;
  row.appendChild(msg);
  if (rec.fields && Object.keys(rec.fields).length) {
    const fd = document.createElement('span'); fd.className = 'fields';
    fd.textContent = Object.entries(rec.fields).map(([k, v]) => k + '=' + (typeof v === 'string' ? JSON.stringify(v) : String(v))).join(' ');
    row.appendChild(fd);
  }
  out.appendChild(row);
  while (out.children.length > 2000) out.removeChild(out.firstChild);
  out.scrollTop = out.scrollHeight;
}

document.querySelectorAll('button[data-ch]').forEach(b => b.onclick = () => {
  document.querySelectorAll('button[data-ch]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  filter = b.dataset.ch;
  for (const row of out.children) {
    row.classList.toggle('hidden', filter !== 'all' && !row.classList.contains('chan-' + filter));
  }
});
document.getElementById('clear').onclick = () => { out.innerHTML = ''; };
connect();
</script>
</body>
</html>
